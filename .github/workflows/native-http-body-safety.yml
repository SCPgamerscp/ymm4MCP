name: Native HTTP body safety tests

on:
  pull_request:
    paths:
      - 'YMM4McpPlugin/McpHttpServer.cs'
      - 'YMM4McpPlugin/RequestBodyValidation.cs'
      - 'tests/RequestBodyValidation.Tests/**'
      - '.github/workflows/native-http-body-safety.yml'
  push:
    branches: [main]
    paths:
      - 'YMM4McpPlugin/McpHttpServer.cs'
      - 'YMM4McpPlugin/RequestBodyValidation.cs'
      - 'tests/RequestBodyValidation.Tests/**'
      - '.github/workflows/native-http-body-safety.yml'

jobs:
  request-body-safety:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/RequestBodyValidation.Tests/RequestBodyValidation.Tests.csproj --configuration Release
