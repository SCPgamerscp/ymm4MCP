name: Keyframe collection rollback tests

on:
  pull_request:
    paths:
      - 'YMM4McpPlugin/KeyframeCollectionMutation.cs'
      - 'tests/KeyframeCollectionRollback.Tests/**'
      - '.github/workflows/keyframe-collection-rollback.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keyframe-collection-rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/KeyframeCollectionRollback.Tests/KeyframeCollectionRollback.Tests.csproj --configuration Release

  # This is a temporary CI-only composition, NOT a GitHub PR merge.
  # Test the five independent #140 fixes together before a maintainer merges
  # any of them. No push permission or credentials are available to this job.
  keyframe-cross-pr-integration:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 219
    # Run the composed source against the same Windows host ABI as packaging.
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compose latest main and related keyframe PR heads locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Keyframe integration CI"
          git config user.email "keyframe-integration@users.noreply.github.com"
          git fetch --no-tags origin main
          if ! git merge --no-ff --no-edit FETCH_HEAD; then
            echo "::error::PR #219 does not integrate cleanly with latest main"
            git diff --name-only --diff-filter=U
            exit 1
          fi
          for number in 218 251 254 255; do
            echo "::group::Compose PR #$number"
            git fetch --no-tags origin "pull/$number/head"
            if ! git merge --no-ff --no-edit FETCH_HEAD; then
              echo "::error::PR #$number conflicts with the composed keyframe changes"
              git diff --name-only --diff-filter=U
              exit 1
            fi
            echo "::endgroup::"
          done
          echo "Composed keyframe PRs #218 #219 #251 #254 #255 against latest main (local only)"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run all combined keyframe regression suites
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t projects < <(find tests -type f -name 'Keyframe*.csproj' | sort)
          if [ "${#projects[@]}" -lt 5 ]; then
            echo "::error::Expected at least five keyframe regression projects, found ${#projects[@]}"
            exit 1
          fi
          for project in "${projects[@]}"; do
            echo "::group::Test $project"
            dotnet run --project "$project" --configuration Release
            echo "::endgroup::"
          done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install smoke-harness HTTP dependency
        run: python -m pip install 'httpx>=0.27.0'
      - name: Verify live-smoke test harness regressions
        run: python -m unittest discover -s mcp-server -p 'test_check_keyframe_compat.py'
      - name: Download official YMM4 Lite build references for composed plugin
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'YukkuriMovieMaker_v4_Lite.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'ymm4-lite'
          Invoke-WebRequest -Uri 'https://files.manjubox.net/YukkuriMovieMaker_v4_Lite.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $directory
          $pluginDlls = @(Get-ChildItem -LiteralPath $directory -Recurse -Filter 'YukkuriMovieMaker.Plugin.dll' -File)
          if ($pluginDlls.Count -ne 1) { throw "Expected one YMM4 Plugin DLL; found $($pluginDlls.Count)" }
          $libPath = $pluginDlls[0].DirectoryName
          if (-not (Test-Path -LiteralPath (Join-Path $libPath 'YukkuriMovieMaker.Controls.dll'))) {
            throw 'YMM4 Controls DLL is missing'
          }
          "YMM4_LIB_PATH=$libPath" >> $env:GITHUB_ENV
      - name: Compile all five keyframe PRs together and inspect the .ymme
        shell: pwsh
        run: |
          dotnet build YMM4McpPlugin/YMM4McpPlugin.csproj --configuration Release -p:CreateYmme=true "-p:YMM4LibPath=$env:YMM4_LIB_PATH"
          if ($LASTEXITCODE -ne 0) { throw 'Composed YMM4 plugin build failed' }
          $version = (dotnet msbuild YMM4McpPlugin/YMM4McpPlugin.csproj -getProperty:Version).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $version) { throw 'Could not determine plugin version' }
          $package = "artifacts/YMM4McpPlugin-$version.ymme"
          if (-not (Test-Path -LiteralPath $package)) { throw "Missing composed package: $package" }
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $package).Path)
          try {
            $actual = @($zip.Entries | Where-Object { $_.Name } | ForEach-Object { $_.FullName })
            $expected = @('YMM4McpPlugin/YMM4McpPlugin.dll', 'YMM4McpPlugin/YMM4McpPlugin.deps.json')
            if (@(Compare-Object $expected $actual).Count -ne 0) {
              throw "Unexpected composed .ymme contents: $($actual -join ', ')"
            }
          }
          finally { $zip.Dispose() }
