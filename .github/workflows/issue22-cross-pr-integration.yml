name: Issue 22 and 140 combined setup, keyframe and release verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-cross-pr-integration:
    # This workflow belongs to PR #228 until it is merged. A manual run can
    # re-check the same set later; no GitHub PR is merged or pushed by this job.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 228
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compose main with the open Issue 22 and 140 PRs (runner only)
        shell: bash
        env:
          # A queued/rerun PR check must test the exact #228 revision it reports.
          # Manual dispatches intentionally compose the latest open PR heads.
          EVENT_PR_228_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          set -euo pipefail
          git config user.name "Issue 22 integration CI"
          git config user.email "integration-ci@users.noreply.github.com"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git checkout -B issue22-composed refs/remotes/origin/main
          # These changes touch separate files but must work as one release:
          # UI links, publishing/installer, HTTP host/body validation,
          # connection discovery, settings persistence, and startup behavior.
          # Also compose the five #140 keyframe fixes against the same plugin
          # before shipping a .ymme. A successful standalone PR build cannot
          # prove that both issue groups are compatible.
          # PR #229 also modifies package-ymme.yml (export QA), so include
          # it to catch cross-PR workflow conflicts before a manual merge.
          for number in 221 228 229 234 241 243 244 248 257 259 218 219 251 254 255; do
            if [[ "$number" == 228 && -n "$EVENT_PR_228_HEAD_SHA" ]]; then
              # Pin the triggering PR to its event SHA, not a newer moving ref.
              git fetch --no-tags origin "$EVENT_PR_228_HEAD_SHA:refs/remotes/pr/${number}"
            else
              git fetch --no-tags origin "refs/pull/${number}/head:refs/remotes/pr/${number}"
            fi
            printf 'Composing PR #%s at %s\n' "${number}" "$(git rev-parse "refs/remotes/pr/${number}")"
            git merge --no-ff --no-edit "refs/remotes/pr/${number}"
          done
          git status --short
      - name: Archive the exact composed source for cross-platform export QA
        shell: bash
        run: git archive --format=tar --output=issue22-composed.tar HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: issue22-composed-source
          path: issue22-composed.tar
          if-no-files-found: error
      - name: Test composed Issue 22 and 140 Python setup, transport and smoke harness
        shell: pwsh
        run: |
          python -m pip install -r mcp-server/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          # The full Python suite runs on Ubuntu in the existing packaging CI.
          # A few unrelated tests hard-code POSIX /tmp paths and cannot pass on
          # Windows. Here, test the combined Issue 22 modules on the same
          # Windows runner as the YMM4 plugin and installer.
          Push-Location mcp-server
          try {
            python -m unittest -q test_release_workflow test_connection_descriptor_integrity test_check_connection_version_integrity test_http_host_ipv6_aliases test_http_body_limit test_check_keyframe_compat
            if ($LASTEXITCODE -ne 0) { throw 'Composed Issue 22 Python tests failed' }
          }
          finally { Pop-Location }
      - name: Test composed export decode QA from PR 229 (#61)
        shell: pwsh
        run: |
          Push-Location mcp-server
          try {
            # PR #229 adds new export QA regression modules over time. The
            # previous hand-maintained module list silently omitted new tests,
            # including expected output-format checks. Discover every matching
            # module from the *composed* source tree, not PR #228 alone.
            $qaTests = @(Get-ChildItem -LiteralPath . -Filter 'test_decoded_media_*.py' -File)
            if ($qaTests.Count -lt 8) {
              throw "Expected export decode QA regression modules from PR #229; found $($qaTests.Count)"
            }
            python -m unittest discover -s . -p 'test_decoded_media_*.py' -q
            if ($LASTEXITCODE -ne 0) { throw 'Composed export decode QA regressions failed' }
          }
          finally { Pop-Location }
      - name: Test composed setup and HTTP safety helpers
        shell: pwsh
        run: |
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'mcp-server/setup.ps1'), [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors) { throw ($parseErrors | Out-String) }
          foreach ($project in @(
            'tests/RepositoryLinkPolicy.Tests/RepositoryLinkPolicy.Tests.csproj',
            'tests/SettingsFileSafety.Tests/SettingsFileSafety.Tests.csproj',
            'tests/SettingsViewSnapshot.Tests/SettingsViewSnapshot.Tests.csproj',
            'tests/RequestBodyValidation.Tests/RequestBodyValidation.Tests.csproj'
          )) {
            dotnet run --project $project --configuration Release
            if ($LASTEXITCODE -ne 0) { throw "Failed composed test: $project" }
          }
      - name: Test all composed keyframe C# regression projects
        shell: pwsh
        run: |
          $projects = @(Get-ChildItem -Path tests -Recurse -Filter 'Keyframe*.csproj' -File | Sort-Object FullName)
          if ($projects.Count -lt 5) { throw "Expected at least five keyframe test projects; found $($projects.Count)" }
          foreach ($project in $projects) {
            dotnet run --project $project.FullName --configuration Release
            if ($LASTEXITCODE -ne 0) { throw "Composed keyframe regression failed: $($project.FullName)" }
          }
      - name: Download official YMM4 Lite references
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'YukkuriMovieMaker_v4_Lite.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'ymm4-lite'
          Invoke-WebRequest -Uri 'https://files.manjubox.net/YukkuriMovieMaker_v4_Lite.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $directory
          $pluginDlls = @(Get-ChildItem -LiteralPath $directory -Recurse -Filter 'YukkuriMovieMaker.Plugin.dll' -File)
          if ($pluginDlls.Count -ne 1) { throw "Expected one YMM4 Plugin DLL; found $($pluginDlls.Count)" }
          $libPath = $pluginDlls[0].DirectoryName
          if (-not (Test-Path -LiteralPath (Join-Path $libPath 'YukkuriMovieMaker.Controls.dll'))) {
            throw 'YMM4 Controls DLL is missing'
          }
          "YMM4_LIB_PATH=$libPath" >> $env:GITHUB_ENV
      - name: Build and verify composed YMM4 .ymme
        shell: pwsh
        run: |
          dotnet build YMM4McpPlugin/YMM4McpPlugin.csproj --configuration Release -p:CreateYmme=true "-p:YMM4LibPath=$env:YMM4_LIB_PATH"
          if ($LASTEXITCODE -ne 0) { throw 'Composed YMM4 plugin build failed' }
          $version = (dotnet msbuild YMM4McpPlugin/YMM4McpPlugin.csproj -getProperty:Version).Trim()
          $package = "artifacts/YMM4McpPlugin-$version.ymme"
          if (-not (Test-Path -LiteralPath $package)) { throw "Missing .ymme: $package" }
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $package).Path)
          try {
            $entries = @($zip.Entries | ForEach-Object { $_.FullName })
            foreach ($required in @('YMM4McpPlugin/YMM4McpPlugin.dll', 'YMM4McpPlugin/YMM4McpPlugin.deps.json')) {
              if ($entries -notcontains $required) { throw "Missing .ymme entry: $required" }
            }
          }
          finally { $zip.Dispose() }
      - name: State the remaining live acceptance gates
        shell: pwsh
        run: |
          Write-Output 'Combined Issue #22/#140 source, regression suites and package passed; no GitHub PR was merged.'
          Write-Output 'NOT TESTED: actual GitHub Release publication, YMM4 host installation, authenticated status, UI port-change E2E, and YMM4 4.56.1.1 keyframe E2E.'

  composed-real-export-qa:
    # Run only after the same composed revision passes the Windows plugin
    # build. The archive is produced by the integration job; no second merge
    # against moving PR heads can silently test different source revisions.
    needs: setup-cross-pr-integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: issue22-composed-source
      - name: Restore composed source
        shell: bash
        run: |
          set -euo pipefail
          mkdir composed
          tar -xf issue22-composed.tar -C composed
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure FFmpeg and ffprobe are available for real export QA
        shell: bash
        run: |
          set -euo pipefail
          # Ubuntu runners generally include FFmpeg. Avoid unconditional
          # apt update/install: package mirrors can stall the only remaining
          # cross-platform QA job even after Windows integration succeeded.
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo 'Using FFmpeg and ffprobe already installed on the runner'
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Install composed MCP dependencies
        run: python -m pip install -r composed/mcp-server/requirements.txt
      - name: Run all composed Python regression tests
        working-directory: composed
        run: python -m unittest discover -s mcp-server -p 'test_*.py' -q
      - name: Run real decoded-export MP4 and stream-tail smoke tests (not mocks)
        working-directory: composed/mcp-server
        run: python -m unittest -v test_decoded_media_real_ffmpeg test_decoded_media_ffmpeg_integration test_decoded_media_required_tail_20261028
